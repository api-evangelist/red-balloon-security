name: Red Balloon Security
description: >-
  Red Balloon Security is an embedded-device and firmware security company that
  protects critical infrastructure across automotive, aerospace, defense,
  industrial control, and electrical-grid systems. Its offerings include Firmware
  Hardening (securing firmware binaries against exploitation without source
  access), Runtime Defense (firmware-level continuous attestation with real-time
  integrity alerts), embedded device security assessments, and the Bitwise FPGA
  bitstream analysis platform. Red Balloon's public developer surface is OFRAK
  (Open Firmware Reverse Analysis Konsole), an open-source binary analysis and
  modification framework that unpacks, analyzes, modifies, and repacks firmware
  and executables, distributed as official Python packages on PyPI with a CLI and
  web GUI. Red Balloon publishes no hosted public REST API; this profile catalogs
  the OFRAK developer surface (packages, CLI, changelog) and company link
  properties.
